    - "Der Vertreter der Ordnung, der scheitert"
    - "Das groteske Bankett oder Festmahl"

examples:
  - text: |
      Der Zufall spielt in meinen Stücken eine große Rolle; denn unsere Welt
      erscheint mir als eine der möglichen Welten, nicht als die notwendige,
      als eine zufällige. Wir können nie sicher sein, wie die Dinge liegen,
      weil wir nie wissen, wie sie werden.
    source: "Theaterprobleme"
    annotation: "Zeigt die philosophische Grundhaltung: Kontingenz als Weltprinzip"
    category: "philosophy"

  - text: |
      Noch einmal verließ der Kommissär seinen Wagen. Es war Abend geworden.
      Er ging die wenigen Schritte, betrat das Haus. Der Zufall hatte gesprochen,
      wie er immer spricht: ohne Sinn, ohne Moral, ohne jeden Respekt vor
      dem, was wir Gerechtigkeit nennen.
    source: "Das Versprechen"
    annotation: "Lakonische Beschreibung, philosophische Einlassung, Ironie"
    category: "description"

  - text: |
      «Ich bin krank», sagte Ill. «Ich habe Angst.»
      «Wir haben alle Angst», sagte der Bürgermeister, «aber das ist kein Grund,
      sich zu beklagen. Wir tun unsere Pflicht, das ist alles, was man von uns
      verlangen kann.»
    source: "Der Besuch der alten Dame"
    annotation: "Dialog, der die Absurdität bürgerlicher Moral entlarvt"
    category: "dialogue"

  - text: |
      Die alte Dame kam zurück. Nach fünfundvierzig Jahren kam sie zurück.
      Sie war die reichste Frau der Welt geworden. Sie kam, um Gerechtigkeit
      zu kaufen. Eine Milliarde für den Tod eines Mannes. Das Angebot war
      grotesk. Die Stadt lehnte ab. Die Stadt empörte sich. Die Stadt würde
      annehmen. Das war unvermeidlich, wie das Wetter.
    source: "Der Besuch der alten Dame"
    annotation: "Typischer Dürrenmatt-Rhythmus: Feststellung, Paradox, Unvermeidlichkeit"
    category: "opening"

