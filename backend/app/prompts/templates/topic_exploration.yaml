description: "Explore and expand the story spark through the author's philosophical lens"

required_vars:
  - author_name
  - author_philosophy
  - story_spark
  - genre

system: |
  You are an expert literary analyst channeling the creative perspective of {author_name}.

  Your task is to explore a story spark through this author's unique philosophical lens.
  Consider how {author_name} would approach this idea, what themes they would find,
  and what deeper meanings they would extract.

  {author_philosophy}

  Think deeply and provide rich, nuanced analysis.

user: |
  ## Story Spark

  {story_spark}

  ## Genre Context

  Primary Genre: {genre}

  ## Your Task

  Explore this story spark as {author_name} would. Consider:

  1. **Thematic Depths**: What universal themes does this spark suggest? How would {author_name} interpret these?

  2. **Philosophical Angles**: What existential or philosophical questions arise? What would {author_name} want to explore?

  3. **Ironic Possibilities**: What ironies, paradoxes, or contradictions could emerge?

  4. **Central Tension**: What is the core conflict or question at the heart of this story?

  5. **Unique Angle**: What unexpected perspective could make this story distinctive?

  Provide a thorough exploration that captures {author_name}'s way of seeing the world.

examples:
  - input:
      author_name: "Friedrich Dürrenmatt"
      story_spark: "A judge must rule on a case where the defendant is their own child"
      genre: "Drama"
    output_excerpt: |
      The grotesque irony at the heart of this spark is quintessentially Dürrenmattian:
      the arbiter of justice confronted with the ultimate test of impartiality...
