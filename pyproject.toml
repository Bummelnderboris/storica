[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storica"
version = "2.0.0"
description = "Canon-centric autonomous novel generation"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.115,<1",  # only touched by AnthropicStructuredLLM in storica/llm.py; 1.x changes the HTTP stack
    "pydantic>=2.5.3",    # every stage output is a validated model
    "pyyaml>=6.0.1",      # briefs and author profiles
]

[project.optional-dependencies]
dev = ["pytest>=7.4.4", "pytest-asyncio>=0.23.3"]

[project.scripts]
storica = "storica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
