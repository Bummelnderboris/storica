version: '3.8'

# Storica — The City of Stories
# Docker Compose configuration for development

services:
  # The Archives (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storica
      POSTGRES_PASSWORD: storica
      POSTGRES_DB: storica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storica"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Messenger Birds (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # City Gates (FastAPI Backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://storica:storica@postgres:5432/storica
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
    volumes:
      - ../authors:/app/authors:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # The Craftsmen (Celery Workers)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://storica:storica@postgres:5432/storica
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ../authors:/app/authors:ro
      - ../src:/app/storica-src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  # The City Face (React Frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
